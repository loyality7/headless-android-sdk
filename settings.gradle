pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "HeadlessAndroidRuntime"
include ':sdk'
include ':example'

// Optional local-only module, kept out of git; included only when the folder exists.
if (file('benchmark').exists()) {
    include ':benchmark'
}
