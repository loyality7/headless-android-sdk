plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.headless.example'
    compileSdk 34

    defaultConfig {
        applicationId "com.headless.example"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    implementation project(':sdk')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}

afterEvaluate {
    tasks.named("installDebug").configure {
        doLast {
            try {
                def adb = android.adbExecutable.toString()
                exec {
                    commandLine adb, "shell", "pm", "grant", "com.headless.example", "moe.shizuku.manager.permission.API_V23"
                    ignoreExitValue = true
                }
                println "Auto-granted moe.shizuku.manager.permission.API_V23 to com.headless.example"
            } catch (Exception e) {
                logger.warn("Could not auto-grant Shizuku permission: " + e.message)
            }
        }
    }
}

